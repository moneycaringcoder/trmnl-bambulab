# Weekly dependency updates, grouped so routine bumps arrive as one PR per
# package tree instead of ten. Security updates ignore the schedule and open
# immediately.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/bridge"
      - "/hosted"
      - "/collector"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The runtime floor is Node 22; types for newer majors would let code
      # typecheck against APIs the deployed runtimes do not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
