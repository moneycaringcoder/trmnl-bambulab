# Weekly dependency updates, grouped so routine workspace bumps arrive as one
# PR instead of ten. Security updates ignore the schedule and open immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    ignore:
      # The runtime floor is Node 22; types for newer majors would let code
      # typecheck against APIs the deployed runtimes do not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/collector"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Production and CI support Node 22 and 24, but the collector image stays
      # on the Node 22 LTS line. Accept patch/minor image updates, not Node majors.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
