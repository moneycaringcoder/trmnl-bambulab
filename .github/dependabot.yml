# Weekly dependency updates, grouped so routine bumps arrive as one PR per
# package tree instead of ten. Security updates ignore the schedule and open
# immediately.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/bridge"
      - "/hosted"
      - "/collector"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
