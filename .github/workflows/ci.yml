name: ci

# This workflow needs no repository secret and must never be given one.
# Nothing it runs may print a printer identifier or a credential.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Read the code, write nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan the whole tree
        run: bash scripts/secret-scan.sh --tree

  bridge:
    name: bridge (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Pinned exactly: the committed lockfile is produced by this line of pnpm.
      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      # --ignore-scripts keeps dependency lifecycle scripts out of CI. Nothing
      # in this tree needs them; vitest and tsc run without them.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  hosted:
    name: hosted tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosted
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      # Two installs. The hosted tier runs the bridge's modules from source —
      # the cron's poller, the payload builder, the templates' variable shape —
      # so typechecking it typechecks bridge files too, and those resolve `zod`
      # from the bridge's own `node_modules`, which a hosted-only install does
      # not create. Same lesson the collector job learned, same fix.
      - name: Install the bridge's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: bridge

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      # These tests are the enforcement for the hosted obligation that no token,
      # device id or webhook URL reaches a log line, including the assertion that
      # adding a field to the Worker's log detail fails the suite. Running them
      # only locally would leave that obligation unenforced.
      - name: Test
        run: pnpm test

      # Proves the bundle still builds, which is how the Worker would first fail
      # if a bridge module reached for something the Workers runtime lacks.
      # Needs no credential: --dry-run neither uploads nor authenticates.
      - name: Bundle
        run: pnpm exec wrangler deploy --dry-run

  collector:
    name: collector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      # Three installs, not one. The collector runs the bridge's and the hosted
      # tier's modules from source rather than copying them, so typechecking it
      # typechecks their files too — and those resolve `zod` and
      # `@neondatabase/serverless` from their own `node_modules`, which a
      # collector-only install does not create. Verified by running this job's
      # steps against a clean checkout: without these two, `pnpm typecheck` fails
      # on both imports while the tests still pass, because vitest resolves them
      # from the collector's tree and tsc does not.
      - name: Install the bridge's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: bridge

      - name: Install the hosted tier's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: hosted

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      # These tests carry the two guarantees this package exists to keep, and an
      # audit found a real break in the second one: that nothing here can publish
      # to a printer, and that losing the lease stops collection instead of
      # leaving two MQTT sessions on one Bambu account. Running them only locally
      # is how that break reached review in the first place.
      - name: Test
        run: pnpm test