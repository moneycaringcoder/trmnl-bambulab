name: ci

# This workflow needs no repository secret and must never be given one.
# Nothing it runs may print a printer identifier or a credential.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Read the code, write nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan the whole tree
        run: bash scripts/secret-scan.sh --tree

      - name: Test the scanner
        run: bash scripts/secret-scan.test.sh

      - name: Scan complete Git history
        run: bash scripts/secret-scan.sh --history

  core:
    name: core (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

  bridge:
    name: bridge (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Pinned exactly: the root lockfile is produced by this version of pnpm.
      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      # --ignore-scripts keeps dependency lifecycle scripts out of CI. Install
      # the whole workspace once from its single frozen root lockfile.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  hosted:
    name: hosted tier (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: hosted
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      # These tests are the enforcement for the hosted obligation that no token,
      # device id or webhook URL reaches a log line, including the assertion that
      # adding a field to the Worker's log detail fails the suite. Running them
      # only locally would leave that obligation unenforced.
      - name: Test
        run: pnpm test

      # Proves the bundle still builds, which is how the Worker would first fail
      # if a shared module reached for something the Workers runtime lacks.
      # Needs no credential: --dry-run neither uploads nor authenticates.
      - name: Bundle
        run: pnpm exec wrangler deploy --dry-run

  collector:
    name: collector (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: collector
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
        working-directory: .

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      # Protects the subscribe-only boundary and lease-loss shutdown contract.
      # Both failures are account-impacting and must stay enforced in CI.
      - name: Test
        run: pnpm test

      # The container is the deployed collector artifact. Building only its
      # TypeScript source would not catch lockfile, Corepack or COPY drift.
      - name: Build container
        run: docker build --file collector/Dockerfile .
        working-directory: .