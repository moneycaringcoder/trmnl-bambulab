<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Set up your printer display</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23151515'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23fbfaf8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --page: #dcdbd9;
        --screen: #fbfaf8;
        --screen-raised: #f2f0ed;
        --field: #fbfaf8;
        --ink: #151515;
        --ink-soft: #5b5b5b;
        --line: #c4c3c2;
        --line-strong: #8f8f8f;
        --bezel: #202020;
        --bezel-edge: #5b5b5b;
        --shadow: #8f8f8f;
        --done-base: #151515;
        --done-pixel: #5b5b5b;
        --done-ink: #fbfaf8;
        --disabled-base: #c4c3c2;
        --disabled-pixel: #8f8f8f;
        --disabled-ink: #5b5b5b;
        --focus: #0d0d0d;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --space-6: 2rem;
        --space-7: 3rem;
        --shell: 52rem;
        --bezel-size: clamp(0.5rem, 0.3rem + 0.8vw, 0.875rem);
        --display: "Silkscreen", "IBM Plex Mono", monospace;
        --body: "IBM Plex Sans", "Segoe UI", sans-serif;
        --data: "IBM Plex Mono", ui-monospace, monospace;
        --bayer-50: conic-gradient(
          from 90deg at 1px 1px,
          transparent 25%,
          var(--done-pixel) 0 50%,
          transparent 0 75%,
          var(--done-pixel) 0
        );
        --disabled-dither: conic-gradient(
          from 90deg at 1px 1px,
          transparent 25%,
          var(--disabled-pixel) 0 50%,
          transparent 0 75%,
          var(--disabled-pixel) 0
        );
      }


      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 20rem;
        background: var(--page);
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(var(--space-3), 4vw, var(--space-7));
        background-color: var(--page);
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: var(--space-4) var(--space-4);
        color: var(--ink);
        font: 400 clamp(0.9375rem, 0.9rem + 0.15vw, 1rem) / 1.55 var(--body);
      }

      main {
        width: min(100%, var(--shell));
        min-height: min(42rem, calc(100vh - var(--space-7)));
        margin: 0 auto;
        padding: clamp(var(--space-5), 4vw, var(--space-7));
        background: var(--screen);
        border: var(--bezel-size) solid var(--bezel);
        outline: 1px solid var(--bezel-edge);
        box-shadow:
          0 var(--space-2) 0 var(--shadow),
          0 var(--space-5) var(--space-6) var(--shadow);
      }

      header {
        margin-bottom: var(--space-6);
      }


      .eyebrow {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin: 0;
        color: var(--ink-soft);
        font: 600 0.6875rem / 1 var(--data);
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .eyebrow::after {
        content: "";
        width: clamp(2rem, 12vw, 7rem);
        height: 1px;
        background: var(--line);
      }

      h1 {
        max-width: 29ch;
        margin: var(--space-4) 0 var(--space-3);
        font: 700 clamp(1.45rem, 1.12rem + 1.6vw, 2.35rem) / 1.22 var(--display);
        letter-spacing: -0.035em;
      }

      .lede {
        max-width: 58ch;
        margin: 0;
        color: var(--ink-soft);
      }

      #stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .layer {
        display: grid;
        grid-template-columns: 2.25rem 1fr auto;
        align-items: baseline;
        gap: var(--space-3);
        min-height: 2.625rem;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--ink-soft);
        font: 500 0.75rem / 1.35 var(--data);
      }

      .layer .n {
        font-variant-numeric: tabular-nums;
      }

      .layer[data-state="done"] {
        border-color: var(--done-base);
        background-color: var(--done-base);
        background-image: var(--bayer-50);
        background-size: 4px 4px;
        color: var(--done-ink);
      }

      .layer[data-state="done"] .body,
      .layer[data-state="done"] .n,
      .layer[data-state="done"] .status {
        background: var(--done-base);
        box-shadow: 0 0 0 var(--space-1) var(--done-base);
      }

      .layer[data-state="active"] {
        position: relative;
        display: block;
        padding: var(--space-5);
        border: 2px solid var(--ink);
        background: var(--screen-raised);
        color: var(--ink);
        font: 400 1rem / 1.55 var(--body);
      }

      .layer[data-state="active"]::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: var(--space-1);
        background: var(--ink);
      }

      .layer[data-state="pending"] {
        border-style: dashed;
        opacity: 0.62;
      }

      .layer h2 {
        margin: 0;
        font: 700 clamp(0.875rem, 0.82rem + 0.2vw, 1rem) / 1.35 var(--display);
        letter-spacing: -0.02em;
      }

      .layer .head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        margin-bottom: var(--space-3);
        padding-top: var(--space-1);
      }

      .layer .head .n {
        color: var(--ink-soft);
        font: 600 0.6875rem / 1 var(--data);
      }

      .layer p {
        max-width: 55ch;
        margin: 0 0 var(--space-4);
        color: var(--ink-soft);
      }

      .field {
        margin-bottom: var(--space-4);
      }

      .field > label {
        display: block;
        margin-bottom: var(--space-2);
        color: var(--ink-soft);
        font: 600 0.6875rem / 1 var(--data);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        min-height: 2.75rem;
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--line-strong);
        border-radius: 0;
        background: var(--field);
        color: var(--ink);
        font: 400 1rem / 1.4 var(--body);
      }

      input[inputmode="numeric"] {
        font: 600 1.2rem / 1.4 var(--data);
        letter-spacing: 0.3em;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
      }

      button,
      a.action {
        min-height: 2.625rem;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--ink);
        border-radius: 0;
        background: var(--ink);
        color: var(--screen);
        font: 600 0.8125rem / 1 var(--data);
        text-decoration: none;
      }

      button {
        cursor: pointer;
      }

      button:hover:not(:disabled),
      a.action:hover {
        background: var(--screen);
        color: var(--ink);
      }

      button[data-kind="quiet"],
      button[data-kind="danger"] {
        background: transparent;
        color: var(--ink);
      }

      button[data-kind="quiet"]:hover:not(:disabled),
      button[data-kind="danger"]:hover:not(:disabled) {
        background: var(--ink);
        color: var(--screen);
      }

      button[data-kind="danger"] {
        border-style: double;
        border-width: 3px;
      }

      button:disabled {
        border-color: var(--disabled-pixel);
        background-color: var(--disabled-base);
        background-image: var(--disabled-dither);
        background-size: 4px 4px;
        color: var(--disabled-ink);
        cursor: wait;
      }

      .printers {
        display: grid;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }

      .printer {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-3);
        border: 1px solid var(--line);
        background: var(--field);
        cursor: pointer;
      }

      .printer:hover {
        border-color: var(--ink);
      }

      .printer:has(input:checked) {
        border: 2px solid var(--ink);
        padding: calc(var(--space-3) - 1px);
        box-shadow: inset var(--space-2) 0 0 var(--ink);
      }

      .printer input {
        width: var(--space-4);
        min-height: var(--space-4);
        margin: 0 0 0 var(--space-1);
        accent-color: var(--ink);
      }

      .printer .name {
        font-weight: 600;
      }

      .printer .meta {
        color: var(--ink-soft);
        font: 400 0.75rem / 1.2 var(--data);
      }

      .printer .meta[data-online="false"] {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }

      .note {
        color: var(--ink-soft);
        font-size: 0.875rem;
      }

      .msg {
        margin-bottom: var(--space-4);
        padding: var(--space-3);
        border: 1px solid var(--ink);
        border-left-width: var(--space-2);
        background: var(--screen-raised);
        font-size: 0.9rem;
      }

      .msg[data-tone="ok"] {
        border-style: double;
        border-width: 3px;
      }

      [hidden] {
        display: none !important;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2) var(--space-5);
        margin-top: var(--space-6);
        padding-top: var(--space-4);
        border-top: 1px solid var(--line);
        color: var(--ink-soft);
        font: 400 0.6875rem / 1.55 var(--data);
      }

      @media (prefers-reduced-motion: no-preference) {
        .layer,
        button,
        a.action {
          transition:
            color 140ms ease-out,
            background-color 140ms ease-out,
            border-color 140ms ease-out,
            opacity 140ms ease-out;
        }
      }

      @media (max-width: 32rem) {
        body {
          padding: var(--space-3);
        }

        main {
          min-height: calc(100vh - var(--space-5));
          padding: var(--space-5) var(--space-4);
        }

        header {
          padding-top: var(--space-7);
        }

        .layer[data-state="active"] {
          padding: var(--space-4);
        }

        .layer[data-state="done"],
        .layer[data-state="pending"] {
          grid-template-columns: 2rem 1fr;
        }

        .layer .status {
          display: none;
        }
      }

      @media (max-width: 23rem) {
        .row > button,
        .row > a.action {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Your printers, in ink.</h1>
        <p class="lede">
          Sign in to Bambu Cloud, pick up to three printers, and the panel does the rest.
        </p>
      </header>

      <div id="boot" class="msg" data-tone="ok">Warming up&hellip;</div>

      <div id="stack" hidden>
        <!-- Layer 1 -->
        <section class="layer" id="l1" data-state="pending" aria-labelledby="l1h">
          <span class="n">01</span>
          <span class="body" id="l1summary">Sign in to Bambu</span>
          <span class="status"></span>
        </section>

        <!-- Layer 2 -->
        <section class="layer" id="l2" data-state="pending" aria-labelledby="l2h">
          <span class="n">02</span>
          <span class="body" id="l2summary">Pick your printers</span>
          <span class="status"></span>
        </section>

        <!-- Layer 3 -->
        <section class="layer" id="l3" data-state="pending" aria-labelledby="l3h">
          <span class="n">03</span>
          <span class="body" id="l3summary">On the wall</span>
          <span class="status"></span>
        </section>
      </div>

      <footer>
        <span>Plugin is read only. LAN mode not supported.</span>
      </footer>
    </main>

    <script type="module">
      // Templates for each layer's active state. Kept as functions rather than
      // hidden markup so a step cannot be reached in a half-filled state.
      const $ = (id) => document.getElementById(id);
      const stack = $("stack");
      const boot = $("boot");
      const tokenStorageName = "trmnlManageToken";
      const backStorageName = "trmnlBackUrl";

      let manageToken = null;
      let backUrl = null;

      const state = {
        account: null, // { device_ids, reauth_required } once enrolled
        email: null, // Bambu account email, held only between steps 1a and 1b
        region: "global",
        printers: null,
        completedCount: null,
      };

      function esc(value) {
        return String(value).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      /**
       * Renders one layer as done, active or pending.
       *
       * `blurbHtml` is named for what it is: markup, inserted unescaped so a
       * blurb can carry a `<strong>`. Every caller is therefore responsible for
       * escaping anything dynamic it puts there. `title` and `summary` are
       * escaped here because they never need markup.
       */
      function paint(id, layerState, { number, title, blurbHtml, summary, body }) {
        const el = $(id);
        el.dataset.state = layerState;
        if (layerState === "active") {
          el.innerHTML =
            `<div class="head"><span class="n">${number}</span>` +
            `<h2 id="${id}h">${esc(title)}</h2></div>` +
            (blurbHtml ? `<p>${blurbHtml}</p>` : "") +
            `<div class="content"></div>`;
          el.querySelector(".content").append(body);
        } else {
          el.innerHTML =
            `<span class="n">${number}</span>` +
            `<span class="body" id="${id}h">${esc(summary ?? title)}</span>` +
            `<span class="status">${layerState === "done" ? "done" : ""}</span>`;
        }
      }

      function node(html) {
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        return template.content;
      }

      function say(target, text, tone) {
        const box = document.createElement("div");
        box.className = "msg";
        if (tone) box.dataset.tone = tone;
        box.textContent = text;
        box.setAttribute("role", tone === "ok" ? "status" : "alert");
        const old = target.querySelector(".msg");
        if (old) old.remove();
        target.prepend(box);
      }

      function readSession(name) {
        try {
          return sessionStorage.getItem(name);
        } catch {
          return null;
        }
      }

      function writeSession(name, value) {
        try {
          sessionStorage.setItem(name, value);
        } catch {
          // In-memory access still works when storage is unavailable.
        }
      }

      function removeSession(name) {
        try {
          sessionStorage.removeItem(name);
        } catch {
          // Nothing else to clear.
        }
      }

      function validBackUrl(value) {
        if (typeof value !== "string" || value === "") return null;
        try {
          const url = new URL(value);
          return url.protocol === "https:" && url.hostname === "trmnl.com" ? value : null;
        } catch {
          return null;
        }
      }

      function captureAccess() {
        const params = new URLSearchParams(location.hash.slice(1));
        const fragmentToken = params.get("manage");
        const fragmentBack = validBackUrl(params.get("back"));

        if (fragmentToken !== null && fragmentToken !== "") {
          manageToken = fragmentToken;
          writeSession(tokenStorageName, fragmentToken);

          backUrl = fragmentBack;
          if (backUrl === null) removeSession(backStorageName);
          else writeSession(backStorageName, backUrl);
        } else {
          manageToken = readSession(tokenStorageName);
          backUrl = fragmentBack ?? validBackUrl(readSession(backStorageName));
          if (fragmentBack !== null) writeSession(backStorageName, fragmentBack);
        }

        if (location.hash !== "") {
          history.replaceState(history.state, "", `${location.pathname}${location.search}`);
        }
      }

      function showAccessPanel(message, tone = "ok") {
        stack.hidden = true;
        boot.hidden = false;
        if (tone) boot.dataset.tone = tone;
        else delete boot.dataset.tone;
        boot.textContent = message;
      }

      function expireAccess() {
        manageToken = null;
        removeSession(tokenStorageName);
        state.account = null;
        state.email = null;
        state.printers = null;
        state.completedCount = null;
        showAccessPanel(
          "This link has expired — open the plugin's Configure button in TRMNL to get a fresh one",
          "",
        );
      }

      // ---- our API --------------------------------------------------------

      async function api(method, path, body) {
        const init = {
          method,
          headers: { Authorization: `Bearer ${manageToken}` },
        };
        if (body !== undefined) {
          init.headers["Content-Type"] = "application/json";
          init.body = JSON.stringify(body);
        }
        const response = await fetch(path, init);
        const text = await response.text();
        let parsed = null;
        if (text !== "") {
          try {
            parsed = JSON.parse(text);
          } catch {
            parsed = null;
          }
        }
        if (response.status === 401) expireAccess();
        return { status: response.status, body: parsed };
      }

      // ---- step 1: Bambu --------------------------------------------------

      function bambuEmailForm() {
        const form = node(`
          <form novalidate>
            <div class="field">
              <label for="br">Region</label>
              <select id="br" name="region">
                <option value="global">Global (bambulab.com)</option>
                <option value="china">China (bambulab.cn)</option>
              </select>
            </div>
            <div class="field">
              <label for="be">Bambu account email</label>
              <input id="be" name="email" type="email" autocomplete="off" required />
            </div>
            <div class="row"><button type="submit">Email me a code</button></div>
          </form>
        `);
        const el = form.querySelector("form");
        el.addEventListener("submit", async (event) => {
          event.preventDefault();
          const parent = $("l1");
          const region = el.querySelector("#br").value;
          const email = el.querySelector("#be").value.trim();
          if (email === "") {
            say(parent, "Enter the email address of your Bambu account.");
            return;
          }
          const button = el.querySelector("button");
          button.disabled = true;
          const result = await api("POST", "/v1/enrol/code", { region, email });
          button.disabled = false;
          if (result.status === 401) return;

          if (result.status === 204 || result.status === 200) {
            state.email = email;
            state.region = region;
            paint("l1", "active", {
              number: "01",
              title: "Enter the code Bambu emailed you",
              blurbHtml:
                `Sent to <strong>${esc(email)}</strong>. Codes expire quickly, so use the newest one. ` +
                "We never ask for your Bambu password.",
              body: bambuCodeForm(),
            });
            return;
          }
          say(parent, "Bambu Cloud could not send a code. Try again shortly.");
        });
        return form;
      }

      function bambuCodeForm() {
        const form = node(`
          <form novalidate>
            <div class="field">
              <label for="bc">Code</label>
              <input id="bc" name="code" inputmode="numeric" autocomplete="one-time-code"
                     maxlength="10" required />
            </div>
            <div class="row">
              <button type="submit">Connect</button>
              <button type="button" data-kind="quiet" data-act="back">Use a different email</button>
            </div>
          </form>
        `);
        const el = form.querySelector("form");
        el.querySelector('[data-act="back"]').addEventListener("click", () => startBambu());
        el.addEventListener("submit", async (event) => {
          event.preventDefault();
          const parent = $("l1");
          const code = el.querySelector("#bc").value.trim();
          const button = el.querySelector("button");
          button.disabled = true;
          const result = await api("POST", "/v1/enrol/session", {
            region: state.region,
            email: state.email,
            code,
          });
          button.disabled = false;
          if (result.status === 401) return;

          if (result.status === 200 && Array.isArray(result.body?.printers)) {
            state.printers = result.body.printers;
            await route();
            return;
          }
          say(parent, result.body?.error ?? "That code was not accepted.");
        });
        return form;
      }

      function startBambu() {
        state.email = null;
        state.printers = null;
        state.completedCount = null;
        stack.hidden = false;
        boot.hidden = true;
        paint("l1", "active", {
          number: "01",
          title: "Sign in to Bambu",
          blurbHtml:
            "Bambu emails you a one-time code. There is no password field on purpose — " +
            "the code is enough, and your password never reaches us.",
          body: bambuEmailForm(),
        });
        paint("l2", "pending", { number: "02", title: "Pick your printers" });
        paint("l3", "pending", { number: "03", title: "On the wall" });
      }

      // ---- step 2: printers ----------------------------------------------

      function printerForm() {
        const rows = state.printers
          .map(
            (printer, index) => `
          <label class="printer">
            <input type="checkbox" name="p" value="${esc(printer.deviceId)}"
                   ${index < 3 ? "checked" : ""} />
            <span>
              <span class="name">${esc(printer.name)}</span><br />
              <span class="meta" data-online="${esc(printer.online)}">
                ${printer.online ? "online" : "offline"}${printer.model ? " &middot; " + esc(printer.model) : ""}
              </span>
            </span>
          </label>`,
          )
          .join("");

        const form = node(`
          <form novalidate>
            <div class="printers">${rows}</div>
            <div class="row">
              <button type="submit">Show these printers</button>
            </div>
          </form>
        `);
        const el = form.querySelector("form");
        el.addEventListener("submit", async (event) => {
          event.preventDefault();
          const parent = $("l2");
          const chosen = [...el.querySelectorAll('input[name="p"]:checked')].map((box) => box.value);
          if (chosen.length === 0) {
            say(parent, "Choose at least one printer.");
            return;
          }
          if (chosen.length > 3) {
            say(parent, "Three printers is the most the display can show legibly.");
            return;
          }
          const button = el.querySelector("button");
          button.disabled = true;
          const result = await api("POST", "/v1/enrol/printers", { deviceIds: chosen });
          button.disabled = false;
          if (result.status === 401) return;

          if (result.status === 204 || result.status === 200) {
            state.account = { device_ids: chosen, reauth_required: false };
            state.printers = null;
            state.completedCount = chosen.length;
            await route();
            return;
          }
          say(parent, result.body?.error ?? "Could not save that selection.");
        });
        return form;
      }

      // ---- step 3: done and settings -------------------------------------

      function donePanel() {
        const wrap = node(`
          <div>
            <p>
              Done — your printers ride the next refresh. E-paper is patient; give it a few minutes.
            </p>
            <div class="row" data-back hidden></div>
          </div>
        `);
        if (backUrl !== null) {
          const link = document.createElement("a");
          link.className = "action";
          link.href = backUrl;
          link.textContent = "Back to TRMNL";
          const row = wrap.querySelector("[data-back]");
          row.append(link);
          row.hidden = false;
        }
        return wrap;
      }

      function managePanel() {
        const count = state.account.device_ids.length;
        const wrap = node(`
          <div>
            ${
              state.account.reauth_required
                ? '<div class="msg">Bambu stopped accepting the saved sign-in, so the display has stopped updating. Choose <strong>Change printers</strong> to sign in again.</div>'
                : ""
            }
            <p>
              ${count === 0 ? "No printers chosen yet." : `Showing ${count} printer${count === 1 ? "" : "s"}.`}
              TRMNL redraws the panel on its own schedule.
            </p>
            <div class="row">
              <button type="button" data-act="printers" data-kind="quiet">Change printers</button>
              <button type="button" data-act="del" data-kind="danger">Delete everything</button>
            </div>
          </div>
        `);

        wrap.querySelector('[data-act="printers"]').addEventListener("click", () => startBambu());
        wrap.querySelector('[data-act="del"]').addEventListener("click", async (event) => {
          const button = event.target;
          if (button.dataset.confirm !== "yes") {
            button.dataset.confirm = "yes";
            button.textContent = "Delete everything — click again";
            return;
          }
          const result = await api("DELETE", "/v1/account");
          if (result.status === 401) return;
          if (result.status === 204 || result.status === 200) {
            state.account = null;
            state.printers = null;
            state.completedCount = null;
            startBambu();
          } else {
            say($("l3"), result.body?.error ?? "Could not delete the account.");
          }
        });
        return wrap;
      }

      // ---- routing --------------------------------------------------------

      async function route() {
        if (manageToken === null) {
          showAccessPanel(
            "Open this page from the TRMNL plugin — install it or press its Configure button.",
          );
          return;
        }

        stack.hidden = false;
        boot.hidden = true;

        const account = await api("GET", "/v1/account");
        if (account.status === 401) return;
        state.account =
          account.status === 200 && Array.isArray(account.body?.device_ids) ? account.body : null;

        if (state.completedCount !== null) {
          paint("l1", "done", {
            number: "01",
            title: "Sign in to Bambu",
            summary: "Signed in",
          });
          paint("l2", "done", {
            number: "02",
            title: "Pick your printers",
            summary: chosenSummary(state.completedCount),
          });
          paint("l3", "active", {
            number: "03",
            title: "On the wall",
            blurbHtml: "",
            body: donePanel(),
          });
          return;
        }

        if (state.printers !== null) {
          paint("l1", "done", {
            number: "01",
            title: "Sign in to Bambu",
            summary: "Signed in",
          });
          paint("l2", "active", {
            number: "02",
            title: "Pick your printers",
            blurbHtml:
              "Up to three fit legibly. The first one you tick takes the lead slot — " +
              "the one you read from across the room.",
            body: printerForm(),
          });
          paint("l3", "pending", { number: "03", title: "On the wall" });
          return;
        }

        if (
          state.account !== null &&
          (state.account.device_ids.length > 0 || state.account.reauth_required)
        ) {
          paint("l1", "done", {
            number: "01",
            title: "Sign in to Bambu",
            summary: "Signed in",
          });
          paint("l2", "done", {
            number: "02",
            title: "Pick your printers",
            summary: chosenSummary(state.account.device_ids.length),
          });
          paint("l3", "active", {
            number: "03",
            title: "On the wall",
            blurbHtml: "",
            body: managePanel(),
          });
          return;
        }

        startBambu();
      }

      function chosenSummary(count) {
        return `${count} printer${count === 1 ? "" : "s"} chosen`;
      }

      // ---- boot -----------------------------------------------------------

      async function start() {
        captureAccess();
        await route();
      }

      start().catch(() => {
        showAccessPanel("Could not load. Reload the page.", "");
      });
    </script>
  </body>
</html>
