<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Set up your printer display</title>
    <link rel="stylesheet" href="/setup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Your printers, in ink.</h1>
        <p class="lede">
          Sign in to Bambu Cloud, pick up to three printers, and the panel does
          the rest.
        </p>
      </header>

      <div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

      <div id="boot" class="msg" data-tone="ok" tabindex="-1">Warming up&hellip;</div>

      <div id="stack" hidden>
        <!-- Layer 1 -->
        <section class="layer" id="l1" data-state="pending" aria-labelledby="l1h">
          <span class="n">01</span>
          <span class="body" id="l1h">Sign in to Bambu</span>
          <span class="status"></span>
        </section>

        <!-- Layer 2 -->
        <section class="layer" id="l2" data-state="pending" aria-labelledby="l2h">
          <span class="n">02</span>
          <span class="body" id="l2h">Pick your printers</span>
          <span class="status"></span>
        </section>

        <!-- Layer 3 -->
        <section class="layer" id="l3" data-state="pending" aria-labelledby="l3h">
          <span class="n">03</span>
          <span class="body" id="l3h">On the wall</span>
          <span class="status"></span>
        </section>
      </div>

      <footer>
        <span>Plugin is read only. LAN mode not supported.</span>
      </footer>
    </main>

    <script type="module" src="/boot.js"></script>
  </body>
</html>
