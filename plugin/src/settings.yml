---
# Shared presentation settings apply to both tiers.
no_screen_padding: "no"
dark_mode: "no"
framework_version: latest
name: Bambu Lab Printer Status
description: Print status at a glance

# Hosted Recipe: TRMNL polls the public Worker and supplies the screen key.
# The reserved example.com host is deliberately not a real deployment.
strategy: polling
refresh_interval: 15
polling_url: https://not-deployed.example.com/v1/screen
polling_headers: 'authorization=bearer ##{{ screen_key }}'
polling_verb: GET
custom_fields:
- keyname: screen_key
  name: Screen key
  field_type: password
  help_text: Copy this from the hosted enrolment page. You can rotate it there.

# Self-hosted tier: create a separate Private Plugin with strategy: webhook.
# Its bridge receives the TRMNL webhook URL; none of the polling_* keys or the
# screen_key field above belong to that tier.
